# Runs only when this folder is the root of a PRIVATE repo (see SETUP.md).
# It commits Claude's scoring output (written from the resume) back to the repo,
# so do not use it in a public repo.
name: Job search (twice daily)

on:
  schedule:
    # 13:17 and 23:17 UTC = about 6am and 4pm Denver time. Off the hour to dodge GitHub's cron rush.
    - cron: "17 13 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run in a public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "This repo is public. Make it private before enabling the job search workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch, filter, and score jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: node src/run.mjs

      - name: Commit updated job data
        run: |
          git config user.name "job-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Job search refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
